name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *' # daily: a Claude Code release that breaks the mod shows up here first
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Claude Code ${{ matrix.claude }}
    # The self-hosted runner named by the repo variable CI_RUNNER takes the
    # owner's and Dependabot's own branches; everything else, pull requests
    # from forks included, runs on GitHub's runners, and so does every job
    # while CI_RUNNER is unset.
    runs-on: ${{ (github.actor == github.repository_owner || github.actor == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pinned: the version in package.json, which Dependabot moves; latest: whatever npm has today.
        claude: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - if: matrix.claude == 'latest'
        run: bun add --dev @anthropic-ai/claude-code@latest
      - run: node_modules/.bin/claude --version
      - name: Validate the manifest, the marketplace and the hooks module
        run: bun run validate
      - name: Run the tests
        run: bun run test
